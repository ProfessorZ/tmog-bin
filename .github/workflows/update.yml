name: update

# Upstream publishes a single unversioned "latest" URL, so the only way to spot
# a new release is to poll it. scripts/update.sh rewrites pkgver/pkgrel and the
# checksum, and this workflow commits the result and mirrors PKGBUILD and
# .SRCINFO to the AUR.
#
# The built package is never uploaded anywhere: the TMOG beta license forbids
# redistribution, so only packaging files leave this repository.

on:
  schedule:
    # Every six hours, off the hour to avoid the scheduler's busiest minute.
    # GitHub disables cron triggers after 60 days without repository activity.
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    name: Check upstream and publish
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    # Container jobs default to `sh -e`, which only tolerates bash syntax here
    # because Arch's /bin/sh is bash. Ask for bash explicitly.
    defaults:
      run:
        shell: bash
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git namcap openssh

      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create build user
        run: |
          useradd --create-home builder
          # makepkg --syncdeps shells out to `sudo pacman -S` as the build user.
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' >/etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check for a new upstream release
        id: update
        run: |
          # makepkg refuses to run as root, and the build user cannot write to
          # the runner's own $GITHUB_OUTPUT, so outputs are relayed via a file.
          install -m 666 /dev/null /tmp/update-output
          sudo -u builder env GITHUB_OUTPUT=/tmp/update-output ./scripts/update.sh
          cat /tmp/update-output >>"$GITHUB_OUTPUT"

      - name: Build the updated package
        if: steps.update.outputs.changed == 'true'
        run: |
          sudo -u builder makepkg --syncdeps --noconfirm --cleanbuild
          namcap ./*.pkg.tar.zst
          pacman --upgrade --noconfirm ./*.pkg.tar.zst

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.update.outputs.version }}
          PKGREL: ${{ steps.update.outputs.pkgrel }}
          REASON: ${{ steps.update.outputs.reason }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          git commit -m "chore: update to ${VERSION}-${PKGREL}" -m "${REASON}"
          git push

      # The AUR steps below are deliberately not gated on `changed`. If an
      # earlier run committed a new version here but failed to reach the AUR,
      # update.sh sees the repository as up to date on the next run and would
      # never retry. Comparing against a fresh AUR clone every time instead
      # makes the mirror self-healing, and creates the package on first push.
      - name: Detect AUR credentials
        id: aur
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          if [[ -n "$AUR_SSH_PRIVATE_KEY" ]]; then
            echo 'configured=true' >>"$GITHUB_OUTPUT"
          else
            echo 'configured=false' >>"$GITHUB_OUTPUT"
            echo '::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR push'
          fi

      - name: Publish to the AUR
        if: steps.aur.outputs.configured == 'true'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          VERSION: ${{ steps.update.outputs.version }}
          PKGREL: ${{ steps.update.outputs.pkgrel }}
        run: |
          install -dm700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" >~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan aur.archlinux.org >>~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes'

          # The AUR repository holds packaging files only, never the CI
          # scaffolding, so it is exported rather than mirrored.
          git clone ssh://aur@aur.archlinux.org/tmog-bin.git /tmp/aur
          cp PKGBUILD .SRCINFO /tmp/aur/
          cd /tmp/aur
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # --cached, because on a brand-new (empty) AUR repository the files
          # are untracked and a plain `git diff` would report no change.
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'AUR already up to date'
            exit 0
          fi
          git commit -m "Update to ${VERSION}-${PKGREL}"
          # Explicit refspec: a clone of an empty AUR repository has no upstream
          # branch configured, and the AUR's branch is always master.
          git push origin HEAD:master
